services:
  db:
    image: postgres:16
    container_name: poster-db
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poster}
      POSTGRES_USER: ${POSTGRES_USER:-poster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан - скопируйте .env.example в .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/postgres/entrypoint.sh:/scripts/entrypoint.sh:ro
      - ./scripts/postgres/generate-certs.sh:/scripts/generate-certs.sh:ro
    healthcheck:
      # По TCP: во время initdb временный сервер слушает только unix-сокет
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-poster} -d ${POSTGRES_DB:-poster}"]
      interval: 2s
      retries: 30

  replica:
    image: postgres:16
    container_name: poster-replica
    entrypoint: ["/bin/bash", "/scripts/replica-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:?Set REPLICATOR_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - replicadata:/var/lib/postgresql/data
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poster} -d ${POSTGRES_DB:-poster}"]
      interval: 5s
      retries: 10

  # Чистый экземпляр для проверки восстановления из бэкапа (make restore).
  # Без именованного тома: make restore каждый раз начинает с пустого кластера.
  restore:
    image: postgres:16
    container_name: poster-restore
    profiles: ["restore"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-poster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан - выполните make env}
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-poster} -d postgres"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
  replicadata: